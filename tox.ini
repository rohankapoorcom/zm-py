[tox]
envlist = py314, pylint, lint, typing
skip_missing_interpreters = True

[gh-actions]
python =
    3.14: py314, pylint, lint, typing

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/zoneminder
commands =
     pytest {posargs} tests --ignore=tests/e2e
deps =
     -r{toxinidir}/requirements.txt
     -r{toxinidir}/requirements-test.txt

[testenv:pylint]
basepython = {env:PYTHON3_PATH:python3.14}
deps =
     -r{toxinidir}/requirements-test.txt
commands =
     pylint {posargs} zoneminder

[testenv:lint]
basepython = {env:PYTHON3_PATH:python3.14}
deps =
     -r{toxinidir}/requirements-test.txt
commands =
     flake8 zoneminder tests
     pydocstyle zoneminder
     black --check --diff zoneminder
     isort --check-only --diff zoneminder tests

[testenv:typing]
basepython = {env:PYTHON3_PATH:python3.14}
allowlist_externals=/bin/bash
deps =
     -r{toxinidir}/requirements-test.txt
commands =
     /bin/bash -c 'mypy zoneminder/*.py'
