[tool.poetry]
name = "zm-py"
version = "0.5.5.dev12"
description = "A loose python wrapper around the ZoneMinder REST API."
authors = ["Rohan Kapoor <rohan@rohankapoor.com>"]
maintainers = ["Nic Boet <nic@boet.cc>"]
license = "Apache-2.0"

readme = "README.md"

homepage = "https://github.com/rohankapoorcom/zm-py"
repository = "https://github.com/rohankapoorcom/zm-py"

classifiers= [
    'Intended Audience :: Developers',
    'License :: OSI Approved :: Apache Software License',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Home Automation'
]

packages = [
    {include = "zoneminder"},
    {include = "tests", format = "sdist"}
]

[tool.poetry.dependencies]
python = "^3.13"
requests = ">=2.32.2"

[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | build
  | dist
  | tests/toml-test
)/
'''

[tool.mypy]
python_version = "3.14"
follow_imports = "silent"
ignore_missing_imports = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.isort]
# https://github.com/timothycrosley/isort
# https://github.com/timothycrosley/isort/wiki/isort-Settings
profile = "black"
# will group `import x` and `from x import` of the same module.
force_sort_within_sections = true
known_first_party = "homeassistant,tests"
forced_separate = "tests"
combine_as_imports = true

[tool.pytest.ini_options]
markers = [
    "zm_e2e: tests that require a live ZoneMinder server (auto-skip if ZM_HOST unset)",
    "zm_e2e_write: e2e tests that mutate ZM state (require ZM_E2E_WRITE=1)",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
